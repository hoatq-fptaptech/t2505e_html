<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Number</title>
</head>
<body>
    
    <script type="text/javascript">
        // code js here
        function lucky_number(){
            var lk = parseInt(Math.random()*100);// 1 số ngẫu nhiên từ 0->99
            console.log(lk);// cheating
            // cho người chơi dự đoán con số 
            var n = prompt("Nhập số mà bạn dự đoán:");
            n = parseInt(n);
            // người chơi đặt số tiền muốn cược:
            var m = prompt("Số tiền bạn đặt cược:");
            m = parseInt(m);
            if(n == lk){
                m = m * 70;
                alert("Chúc mừng bạn đã thắng cuộc, số tiền thu về lần chơi này: "+m);
            }else{
                alert("Chúc bạn may mắn vào ngày mai nếu còn tiền.");
            }
        }
        lucky_number();
    </script>
</body>
</html>
