<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAN</title>
</head>
<body>
    <div class="fan-box">
        <img id="fan" src="images/canh-quat.png" width="400"/>
    </div>

    <script type="text/javascript">
        var dg = 0;
        var so_lan_quay = 0;
        var max_quay = 7;
        var vong_quay = setInterval(function() {
            dg+=20;
            so_lan_quay++;
            var f = document.getElementById("fan");
            f.style.transform = `rotate(${dg}deg)`;
            if(dg == 360){
                dg = 0;
            }
            if(so_lan_quay == max_quay){
                clearInterval(vong_quay);
            }
        }, 100);
    </script>
</body>
</html>
