<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAN</title>
</head>
<body>
    <div class="fan-box">
        <img id="fan" src="images/canh-quat.png" width="400"/>
    </div>

    <script type="text/javascript">
        var dg = 0;
        setInterval(function() {
            dg+=60;
            var f = document.getElementById("fan");
            f.style.transform = `rotate(${dg}deg)`;
            if(dg == 360){
                dg = 0;
            }
        }, 5);
    </script>
</body>
</html>
